name: build-and-test
on:
  push:
    branches: [main,dev]
  pull_request:
    branches: [main,dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # we use runs-on: ubuntu-latest to specify the operating system for the job means that the job will run on the latest version of Ubuntu available in GitHub Actions. This ensures that the build and test processes are executed in a consistent environment, which helps to avoid issues related to differences in operating systems or configurations.

    steps:
      - name: checkout code
        uses: actions/checkout@v4  # This step checks out the code from the repository so that it can be built and tested in subsequent steps.
      
      - name: Setup Node.js
        uses: actions/setup-node@v4  # This step sets up the Node.js environment for the job, allowing us to run Node.js commands and scripts.
        with:
          node-version: '22'  # This specifies the version of Node.js to use for the job. In this case, we are using version 22.

      - name: Install backend dependencies
        run: npm ci  # we use ci command to install the backend dependencies defined in the package-lock.json file. This ensures that the exact versions of dependencies are installed, which helps to avoid issues related to version mismatches.
        working-directory: ./server

      - name: Lint backend code
        run: npm run lint -- --max-warnings=0  # This step runs the linting process on the backend code to check for code style and formatting issues. Linting helps to maintain code quality and consistency across the project.
        working-directory: ./server

      - name: Install frontend dependencies
        run: npm ci   # This step installs the frontend dependencies defined in the package-lock.json file located in the frontend directory.
        working-directory: ./client

      - name: Lint frontend code
        run: npm run lint -- --max-warnings=0  # This step runs the linting process on the frontend code to check for code style and formatting issues.
        working-directory: ./client

      - name: Build backend Image
        run: docker build -t backend-image ./server  # This step builds a Docker image for the backend application using the Dockerfile located in the server directory. The image is tagged as "backend-image".

      - name: Build frontend Image
        run: docker build -t frontend-image ./client  # This step builds a Docker image for the frontend application using the Dockerfile located in the client directory. The image is tagged as "frontend-image".

  deploy:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: Add EC2 host to known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}

    - name: Write SSH key
      run: |
        echo "${EC2_KEY}" | base64 -d > ec2_key.pem 2>/dev/null || { echo "base64 decode failed"; exit 1; }
        tr -d '\r' < ec2_key.pem > ec2_key.pem.tmp && mv ec2_key.pem.tmp ec2_key.pem
        chmod 600 ec2_key.pem
        echo "--- fingerprint of deployed key ---"
        ssh-keygen -lf ec2_key.pem
      env:
        EC2_KEY: ${{ secrets.EC2_KEY }}

    - name: Verify SSH key
      run: |
        ssh-keygen -y -f ec2_key.pem > /tmp/ec2_public_key.pub
        echo "SSH key format is valid"

    - name: Test SSH connection
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
      run: |
        ssh -v -i ec2_key.pem \
          -o StrictHostKeyChecking=no \
          -o IdentitiesOnly=yes \
          "${EC2_USER}@${EC2_HOST}" \
          "whoami && hostname"

    - name: Deploy on EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      run: |
        ssh -i ec2_key.pem \
          -o StrictHostKeyChecking=no \
          -o IdentitiesOnly=yes \
          "${EC2_USER}@${EC2_HOST}" << 'EOF'

          set -e

          cd "${EC2_APP_DIR}"

          git fetch --all
          git reset --hard origin/main

          docker compose up -d --build

          docker image prune -f

          docker compose ps
        EOF

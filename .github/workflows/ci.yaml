name: build-and-test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./server

      - name: Lint backend code
        run: npm run lint -- --max-warnings=0
        working-directory: ./server

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./client

      - name: Lint frontend code
        run: npm run lint -- --max-warnings=0
        working-directory: ./client

      - name: Build backend Image
        run: docker build -t backend-image ./server

      - name: Build frontend Image
        run: docker build -t frontend-image ./client

  deploy:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Write SSH key
        run: |
          echo "${EC2_KEY}" | base64 -d > ec2_key.pem 2>/dev/null || { echo "base64 decode failed"; exit 1; }
          tr -d '\r' < ec2_key.pem > ec2_key.pem.tmp && mv ec2_key.pem.tmp ec2_key.pem
          chmod 400 ec2_key.pem  # FIX: 400 instead of 600
          echo "--- fingerprint of deployed key ---"
          ssh-keygen -lf ec2_key.pem
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}

      - name: Verify SSH key format
        run: |
          ssh-keygen -y -f ec2_key.pem > /tmp/ec2_public_key.pub
          echo "SSH key format is valid"
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}

      - name: Test SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -v -i ec2_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "whoami && hostname"

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}  # <-- ADD THIS SECRET
        run: |
          ssh -i ec2_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            "${EC2_USER}@${EC2_HOST}" << EOF  # FIX: unquoted EOF
          set -e
          cd "${EC2_APP_DIR}"
          git fetch --all
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f
          docker compose ps
          EOF